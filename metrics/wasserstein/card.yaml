schema_version: 1

name: wasserstein
kind: metric

# "The cost of moving one field onto the other."
category: transport

summary: >-
  Quadratic Wasserstein distance between two density fields on a periodic domain: the root
  mean square distance the reference's mass must move to become the candidate's, each
  density divided by its own mean.

status: candidate
owners: [khegazy]

output:
  description: >-
    The quadratic Wasserstein distance between the reference and candidate densities, each
    divided by its mean, on the periodic analysis grid, in the grid's units of length. Zero
    when the two normalised densities coincide.
  bounds:
    lower: 0.0
    upper: null      # bounded by half the domain's diagonal, which depends on the grid

math:
  # W_2 is a distance between probability measures (Peyre & Cuturi 2019, Prop. 2.3); the map
  # from a positive field to its normalised density makes it a pseudometric on fields, zero
  # between two densities that differ by a constant factor.
  triangle_inequality: true
  scale_dependent: false       # each density is divided by its own mean
  resolution_dependent: true   # a continuous distance, but between the fields as the analysis
                               # grid averages them, so structure below a cell is lost first
  complexity: "O(N log N)"     # a few Newton steps, each a fixed number of FFTs
references: [saumier2015, peyrecuturi2019, peyre2018, delon2010, engquist2014, yang2018,
             engquistyang2022]
review: null
