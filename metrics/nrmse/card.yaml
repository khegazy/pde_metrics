schema_version: 1

name: nrmse
kind: metric
category: pointwise

summary: >-
  Root mean squared error of each channel divided by the root mean square of the reference
  channel, with no mean removed, averaged over channels: PDEBench's nRMSE.

status: candidate
owners: [khegazy]

output:
  description: >-
    Dimensionless mean over channels of each channel's RMSE over the reference channel's root
    mean square. NaN where a reference channel is zero in every cell.
  bounds:
    lower: 0.0
    upper: null

math:
  triangle_inequality: false   # each term is scaled by its own first argument's root mean square
  scale_dependent: false       # scaling both fields by c leaves every ratio unchanged
  resolution_dependent: true   # both numerator and denominator are means over cells
  complexity: "O(N)"
references: [takamoto2022, ohana2024]
review: null
