# The typed half of this bundle's card. Every field is documented, with the reasoning
# behind it, in fmeval/cards/schema.py.
schema_version: 1

name: rank_histogram_chi2
kind: metric

category: probabilistic

summary: Pearson's chi-square statistic of the rank histogram against the flat one, the
  test statistic the field computes for an ensemble's calibration; grows with the sample.

status: candidate

owners: [khegazy]

output:
  description: Chi-square statistic of the rank counts against uniform, dimensionless. Zero
    for a flat histogram; the number of members in expectation for independent draws from a
    calibrated ensemble; at most the number of draws times the number of members.
  bounds:
    lower: 0.0
    upper: null

math:
  triangle_inequality: false
  scale_dependent: false      # ranks are invariant to any monotone rescaling of the field
  resolution_dependent: true  # the statistic grows with the number of cells at a fixed shape
  complexity: "O(N M)"        # N cells, M members
references: []

review: null
