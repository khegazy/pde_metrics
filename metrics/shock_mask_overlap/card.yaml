schema_version: 1

name: shock_mask_overlap
kind: metric

# "Where features are, and what shape they have": the metric finds the shocks in each field
# and asks how many shocked cells the two fields share, never comparing values cell by cell.
category: geometric

summary: >-
  Dice coefficient of the shocks detected in the reference and in the candidate pressure: the
  number of shocked cells the two fields share, over the mean number each has.

status: candidate
owners: [khegazy]

output:
  description: >-
    The Dice coefficient of the two sets of shocked cells, dimensionless: 1 when the sets
    coincide or both are empty, 0 when they share no cell or only one field has a shock.
  bounds:
    lower: 0.0
    upper: 1.0

math:
  # One minus the Dice coefficient is not a metric on sets. On a line, A = {1}, B = {1, 2},
  # C = {2} give 1 - DICE(A, C) = 1 but (1 - DICE(A, B)) + (1 - DICE(B, C)) = 1/3 + 1/3.
  # And two distinct fields with the same shock set score 1.
  triangle_inequality: false
  # The detector reads pressure ratios, so scaling both fields by a positive constant (a change
  # of pressure units) flags the same cells and leaves the value unchanged. A zero or negative
  # constant is not a rescaled pressure: it leaves no positive pressure, so both masks are
  # empty and the value is 1 by the convention of issues/120.
  scale_dependent: false
  # Which cells are flagged, and how many a shock occupies, depend on the grid.
  resolution_dependent: true
  complexity: "O(N)"    # one stencil pass per field and a count
references: [taha2015, maierhein2024, dice1945, jaccard1912, schaal2015]
review: null
