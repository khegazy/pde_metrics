case:
  id: default
  group: isentropic_vortex
  units: lattice
  N_simulations: 1
  discretization:
    spatial:
      type: provided
      grid:
      - 100
      - 100
      length:
      - 10.0
      - 10.0
      resolution: 0.1
      unit: '-'
    temporal:
      type: adaptive
      grid: 200000
      length: 0.75
      unit: '-'
  simulation_subdir: isentropic_vortex/default/62ae98c5
  physics:
    type: compressible_fluids
    parameters:
      dimension: 2
      specific_heat_ratio: 1.4
      prandtl: 0.71
      dynamic_viscosity: 1.0e-05
      freestream_hold: reynolds
      reference:
        density: 1.0
  subgrid: {}
  lattice:
    type: D2Q16
    shifts:
    - 0.0
    - 0.0
    use_static_weights: true
  solver:
    type: pond
    cfl: 0.2
    transport:
      type: dugks
      reconstruction:
        muscl: true
        limiter: van_leer
        scheme: mp5
      face_pc:
        iters: 20
        tol: 1.0e-10
        preserve_macro_corrected_g_residual: false
        preserve_macro_corrected_f_residual: false
        temperature_average: sqrt
    diagnostics:
      stabilizer_telemetry: false
  boundary_conditions:
    Periodic:
      axes:
      - x
      - y
  initial_conditions:
    density: 1.0
    pressure: 1.0
    strength: 5.0
    radius: 1.0
    center:
    - 0.5
    - 0.5
    boost:
    - 1.0
    - 1.0
  assets: {}
precision:
  dtype: torch.float64
  amp_enabled: false
  amp_dtype: bf16
normalization:
  feature: none
domain_decomposition:
