N_simulations: 1
boundary_conditions:
  Inlet:
    boundaries:
    - 0
    dimensions:
    - 0
  Neuman:
    boundaries:
    - 1
    - 0
    - 1
    dimensions:
    - 0
    - 1
    - 1
collision:
  enforce_positive: true
  type: !!python/object/apply:kinet.config.common.collision.CollisionType
  - entropic_BGK
domain_decomposition:
  enabled: false
  halo_width:
  - 1
  - 1
  mesh_shape:
  - 4
  - 2
  print_mesh_map: true
  print_topology: true
  print_topology_per_rank: true
  print_topology_style: compact
  topology_json_path: topology/dd_topology.json
  use_device_mesh: true
dtype: float64
io:
  adios2:
    engine: BP5
    parameters:
      Profile: 'Off'
    put_mode: deferred
    use_gpu_put: true
  async_put_timeout_s: 30
  async_queue_depth: -1
  async_queue_memory_basis: available
  async_queue_memory_fraction: 0.8
  async_writer: true
  backend: hdf5
  blosc2_clevel: 0
  blosc2_cname: null
  compression: null
  compression_shuffle: true
  dd_stage_sync_debug: false
  parallel_hdf5: false
  save_every_n: 1
  slurm_drain_extra_s: 120
  stitch_segments_on_full_complete: false
  use_fill_value: true
lattice:
  shifts:
  - 0.4
  - 0.0
  type: !!python/object/apply:kinet.config.common.lattice.LatticeType
  - D2Q9
  use_static_weights: false
neurde:
  F:
    type: extended
  G:
    type: levermore
normalization: nondimensional
obstacles:
  Cylinder:
    center:
    - 166
    - 150
    radius: 20
pred_length: 1000
runtime_logging:
  every_n: 500
  sim_stats_enabled: true
scheme:
  output_variables:
  - all
  - mach
  system_parameters:
    initial_conditions:
      Ns: 0.6
      density: 1.0
      mach: 1.8
      temperature: 0.2
    prandtl: 0.71
    reynolds: 300.0
    specific_heat_ratio: 1.4
  type: compressible_fluids
solver:
  type: lbm
spatiotemporal_grid:
  spatial:
    grid:
    - 500
    - 300
    length:
    - 500.0
    - 300.0
    resolution: 1.0
    type: provided
    unit: '-'
  temporal:
    grid: 1000
    length: 1000.0
    resolution: 1.0
    type: provided
    unit: '-'
stability:
  input_dists:
  - F
  - Feq
  scales:
  - 2.0
  - 1.905
  - 1.481
  tolerances:
  - 0.01
  - 0.1
  - 1.0
  type: piecewise
units: dimensionless
