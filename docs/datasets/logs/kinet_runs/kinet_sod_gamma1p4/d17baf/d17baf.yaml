  temporal:
    grid: 1000
    length: 1000.0
    resolution: 1.0
    type: provided
stability:
  input_dists:
  - F
  - Feq
  scales:
  - 2.0
  - 1.851
  - 1.835
  - 1.818
  tolerances:
  - 0.001
  - 0.01
  - 0.1
  - 1.0
  type: piecewise
