case:
  N_simulations: 1
  assets: {}
  boundary_conditions:
    Periodic:
      axes:
      - x
      - y
  coarse_grain:
    ignore_datasets:
    - stability_scale
    scheduler: threads
    skip_existing: true
  collision:
    stabilizer:
      input_dists:
      - F
      - Feq
      max_iterations: 50
      type: entropic
    type: entropic_BGK
  discretization:
    spatial:
      grid:
      - 256
      - 256
      length:
      - 256.0
      - 256.0
      resolution: 1.0
      type: provided
    temporal:
      grid: 100
      length: 100.0
      resolution: 1.0
      type: provided
  features:
  - turbulence
  group: doubly_periodic
  id: shear_layer
  initial_conditions:
    epsilon: 0.05
    lambda: 80
  lattice:
    shifts:
    - 0.0
    - 0.0
    type: D2Q9
    use_static_weights: false
  physics:
    output_variables:
    - vorticity
    parameters:
      mach: 0.1
      reference:
        density: 1.0
      reynolds: 50000.0
    type: weakly_compressible_isothermal_fluids
  simulate_equilibrium_closure:
    F:
      output_dists:
      - calculator: neq
        dist_label: F
        variations:
        - L2
      type: entropic
  simulation_subdir: doubly_periodic/shear_layer/3484e2b7
  solver:
    gather: sequential
    interpolation:
      degree: 1
      family: lagrange
    type: lbm
  subgrid: {}
  units: lattice
case_path: doubly_periodic/shear_layer
normalization:
  feature: none
precision:
  dtype: torch.float64
