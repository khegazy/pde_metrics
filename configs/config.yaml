# Top-level evaluation config.
#
#   python evaluate.py metrics=[mse] dataset=kinet_re5e4_dev
#
# `metrics` is deliberately a plain list rather than a Hydra config group: a group would
# force one YAML file per metric, which is exactly the friction the registry removes.
#
# `_schema` is `fmeval.config.Config`: it declares every key with its default, so a file here
# states a key only to change it, and a misspelt or missing key fails when the run starts.
defaults:
  - _schema
  - dataset: kinet_re5e4_dev
  - degradation: default
  - report: default
  - _self_

paths:
  # The `datasets` link in the repository root, found from the code rather than the working
  # directory, so a run started anywhere reads the local copy. Results go where you are.
  data: ${repo:}/datasets
  results: ${hydra:runtime.cwd}/results
  # Where the same tree is published, for colleagues with no CFS mount. The URL tree
  # mirrors `paths.data` one directory for one -- `datasets` points at
  # /global/cfs/cdirs/m4790/Data and the portal serves that directory -- so a dataset
  # config's `path: ${paths.data}/kinet/...` needs no second spelling and no per-dataset
  # URL. Measured 2026-08-27: HEAD on the production trajectory returns Content-Length
  # 178271350284, exactly `os.path.getsize` of the CFS copy.
  #
  # The local copy always wins; this is only reached when the file is not on disk. Set it
  # to null to refuse the network and fail when there is no local copy.
  data_url: https://portal.nersc.gov/project/m4790/Data

# Metric names resolved against the registry. `python -m metrics` lists them.
metrics: [mae, mse, nrmse]

# `fields` (default: every field the dataset lists that a selected metric accepts) and
# `analysis_grid` (default: the native resolution, block_mean) are documented on their schema
# in fmeval/config.py.

# The analysis layer. `anchor` is the LADDER ENTRY (a label under degradation.ladder, not an
# operator) whose median value defines damage D = 1. It must be a non-ordinal entry. Fixed once
# per run and never per metric; run_meta.json records it as `anchor_label`, and
# TEST_DESCRIPTION.md `anchor_source` says what D = 1 means for each choice.
analysis:
  anchor: uncorrelated

seed: 20260807

hydra:
  # Hydra's own bookkeeping (resolved config, job log) goes out of the way; the run folders
  # this project actually produces are written under `paths.results` by evaluate.py.
  #
  # These are plain relative paths on purpose. `${paths.results}` would interpolate
  # `${hydra:runtime.cwd}`, and `hydra.sweep.dir` is resolved BEFORE HydraConfig exists, so
  # a multirun would fail with "HydraConfig was not set". Relative is safe because
  # `job.chdir` is false, so it resolves against the directory you launched from.
  run:
    dir: results/.hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: results/.hydra/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    # REQUIRED. With chdir=true the relative `datasets` symlink and the package imports
    # both break, with errors that point nowhere near the cause.
    chdir: false
