# Shared by every config of the Re=5e4, Ma=0.1 D2Q9 simulation: the raw production trajectory,
# its 101-frame development sibling, and the Well-format copy. Each of those states its name,
# format and trajectory, and only what differs from this file.
#
# A file whose name starts with `_` is a fragment inherited through a `defaults:` list, not a
# dataset you can select.
path: ${paths.data}/kinet/doubly_periodic/weakly_compressible_isoT_fluids/sys_Re-5e4_Ma-1en1/${.trajectory}.h5

# pressure is omitted: it is density * c_s^2 and carries no independent information, so
# including it doubles the I/O and injects a guaranteed correlated pair into the
# cross-metric correlation used for pruning.
# temperature is omitted: stored (1,1,T,1,1), spatially degenerate, constant 1/3.
fields: [density, velocity, vorticity]

time:
  start: 1        # t=0 has all-NaN stability fields and a NaN time_scale[0]
  reduction: 50   # evaluate every Nth frame; 50 -> 201 frames of the production trajectory

complexity:
  family: reynolds_ladder_2d
  rank: 0
  params: {reynolds: 5.0e4, mach: 0.1, resolution: 256, dim: 2}
  label: "Re = 5\\times10^{4}"

notes: "Re=5e4, Ma=0.1, D2Q9 entropic BGK, 256^2, dimensionless units."
