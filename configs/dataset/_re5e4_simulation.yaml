# Shared by every config of the Re=5e4, Ma=0.1 D2Q9 simulation: the raw production trajectory,
# its 101-frame development sibling, and the Well-format copy. Each of those states its name,
# format and trajectory, and only what differs from this file.
#
# A file whose name starts with `_` is a fragment inherited through a `defaults:` list, not a
# dataset you can select.
defaults:
  - _reynolds_ladder_2d
  - _self_

path: ${paths.data}/kinet/doubly_periodic/weakly_compressible_isoT_fluids/sys_Re-5e4_Ma-1en1/${.trajectory}.h5

complexity:
  rank: 0
  params: {reynolds: 5.0e4, resolution: 256}
  label: "Re = 5\\times10^{4}"

notes: "Re=5e4, Ma=0.1, D2Q9 entropic BGK, 256^2, dimensionless units."
