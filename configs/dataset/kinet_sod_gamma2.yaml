# kinet's Sod run with gamma = 2, viscosity 0.025: left (rho, p) = (0.5, 0.1), right
# (2, 0.05). Two runs of the same configuration exist: `c76b17` (the default, kinet's
# `latest.h5`, resumed at step 930) and `15aa6b` (uninterrupted); they agree to 1e-13. Choose
# one with `dataset.trajectory=D2Q9_shape-3001-5_T-1000_H-<key>`.
# Evaluated on the fragment's window, for every metric. Its viscous shock is spread so that no
# neighbouring pressure ratio exceeds 1.05, below the detector's Mach 1.3 ratio: the shock-set
# metrics flag nothing and score the both-empty 0 in every frame. They cost 0.1 s a frame and
# no selector removes a metric for one dataset, so they run and are read as that null.
defaults:
  - _kinet_sod
  - _self_

name: kinet_sod_gamma2
trajectory: D2Q9_shape-3001-5_T-1000_H-c76b17
path: ${paths.data}/kinet/sod/compressible_fluids/Pr-71en2_vuy-2_visc-25en3/${.trajectory}_flat.h5

complexity:
  rank: 1
  params: {gamma: 2.0, viscosity: 0.025}
  label: "kinet Sod, \\gamma = 2"
