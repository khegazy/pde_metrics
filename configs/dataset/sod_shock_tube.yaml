# The exact solution of Sod's shock tube, computed on the fly: 1D Euler equations, ideal gas
# (gamma = 1.4), left state rho = 1, p = 1, right state rho = 0.125, p = 0.1, both at rest,
# diaphragm at x = 0.5 on [0, 1). See fmeval/data/analytic.py and docs/datasets/sod_shock_tube.md.
#
# NOT PHYSICAL EVIDENCE. A closed form validates the harness against an answer known in
# advance; it says nothing about a simulated flow, and it is not in evidence_datasets.
#
# The time window is the reader's default, t from 0.1 to 0.2 in 10 frames, on 2048 cells.
# It starts when every wave is fully developed on the grid: at t = 0.1 the narrowest region,
# between the contact and the shock, is 169 cells wide, more than ten times the largest
# translation in the default ladder (16 cells). It ends at the standard t = 0.2, before the
# shock reaches the wall at t = 0.2854. The boundary is Neumann (zero-gradient) on x, so
# metrics that need a periodic domain are not run on this dataset.
name: sod_shock_tube
format: sod_shock_tube

# Unused: the reader computes its frames. Declared because every dataset config carries one.
path: ${paths.data}
trajectory: sod_shock_tube

fields: [density, velocity, pressure]

complexity:
  family: sod_shock_tube
  rank: -1          # generated: below every physical dataset
  label: "Sod shock tube (exact solution)"

notes: "Exact Riemann solution of Sod's shock tube, gamma = 1.4, computed on the fly.
  See fmeval/data/analytic.py."
