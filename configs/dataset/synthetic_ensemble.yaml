# A generated ensemble, for exercising the probabilistic metrics against a case whose right
# answer is known in closed form.
#
# NOT PHYSICAL EVIDENCE. Nothing here is a simulation: the fields are a deterministic
# two-scale pattern plus Gaussian noise. What it provides is a *calibrated null* -- the
# reference is drawn from the same process as the members, with the same sigma, so the
# ensemble is exchangeable with it and every probabilistic metric has an analytic target:
# rank histograms are flat, the spread-to-skill ratio is one, and CRPS matches the closed
# form for a normal predictive distribution. A metric that disagrees here is wrong.
#
# No ensemble of real flow realizations exists yet (issues/004-independent-realizations.md);
# when one does, these metrics will already have been validated where there are no unknowns.
# Use kinet_re5e4 for any physical conclusion.
# The name carries no `_dev` suffix on purpose. In this repository that suffix means "a
# reduced version of a real dataset, for exercising the code path quickly", and a card
# citing such a run fails its tests. This is not a reduced version of anything: it is the
# full and only form of a calibrated null, and a card may cite it.
name: synthetic_ensemble
format: synthetic_ensemble

# Unused: the reader generates its frames rather than reading them. Declared because every
# dataset config carries one; evaluate.py skips the existence check for this format.
path: ${paths.data}
trajectory: synthetic_ensemble

fields: [density]

reader:
  n_members: 16     # large enough that the sampling floor of the rank histogram is not the
                    # dominant signal, small enough that a full run stays under a second
  n_frames: 12      # per-frame rank correlation needs several genuinely different frames
  grid: [64, 64]
  # sigma (the dispersion of both the members and the reference, equal by construction) and
  # omega (the phase advance between frames) keep the reader's defaults.
  #
  # What is evaluated (docs/recipes/add-a-dataset.md step 3; the log,
  # docs/datasets/logs/synthetic_ensemble.md, section 3). Nothing is stored; the frames,
  # members and grid set the time. Every frame is an independent draw, so 12 frames are 12
  # independent samples of every per-frame statistic. Measured 2026-11-26 on a login node,
  # per frame and severity level: crps 0.0009 s, variogram_score 1.67 s at 64^2 (0.12 s at
  # 32^2, cost growing with the square of the cell count). The whole registry on one frame
  # of ensemble_miscalibration (30 levels) takes 42 s, 97% of it variogram_score, so the full
  # panel over 12 frames is about 8.4 minutes. 12 frames at 64^2 hold the Gneiting CRPS to a
  # standard error of about 0.0025, a seventh of the smallest gap between forecasters. Kept
  # as it is because the four ensemble cards cite these numbers; the 32^2 alternative is
  # proposed in the log, not applied.
  #
  # The spec-08 experiments run on this config by override (no config of their own yet):
  #   Gneiting:        degradation=gneiting_forecasters +dataset.reader.base=case_means
  #                    +dataset.reader.sigma=1                      (12 frames, ~2 min)
  #   spread varies:   +dataset.reader.sigma=0.05 +dataset.reader.sigma_ratio=4
  #   correlated:      dataset.reader.grid=[32,32] dataset.reader.n_frames=40
  #                    +dataset.reader.base=zero +dataset.reader.sigma=1
  #                    +dataset.reader.noise_length=3, members varied with
  #                    +dataset.reader.member_noise_length=...      (40 frames, ~3 min)
  #   wrong centre:    +dataset.reader.member_offset=1
  #   positive:        +dataset.reader.log_amplitude=0.1

# No velocity, so there is no vorticity to recompute.
recompute_derived: false

complexity:
  family: synthetic_ensemble
  rank: -1          # below every physical dataset: this exercises a code path and validates
                    # estimators, and must never be read as evidence about a flow
  label: "Synthetic exchangeable ensemble"

notes: "Generated, not measured. Reference and members are independent draws from one
  N(base, sigma^2) process, hence exchangeable. See fmeval/data/synthetic_ensemble.py."
