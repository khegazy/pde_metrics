# Shared by every run of the doubly periodic Reynolds ladder: D2Q9 entropic BGK, Ma = 0.1, the
# same two shear layers as initial condition (lambda = 80, epsilon = 0.05, density 1), on a
# doubly periodic square, until the same dimensionless time 2.2553. Each run's own simulation
# fragment or config states its path, Reynolds number and resolution.
#
# A file whose name starts with `_` is a fragment inherited through a `defaults:` list, not a
# dataset you can select.

# pressure is omitted: it is density * c_s^2 and carries no independent information, so
# including it doubles the I/O and injects a guaranteed correlated pair into the
# cross-metric correlation used for pruning.
# temperature is omitted: stored (1,1,T,1,1), spatially degenerate, constant 1/3.
fields: [density, velocity, vorticity]

# Frame indices are those of the 256^2 run: a finer run reads every Nth stored frame
# (`reader.frame_stride`), so frame i is the same physical time on every member and one
# selection serves the family.
time:
  start: 1        # t=0 has all-NaN stability fields and a NaN time_scale[0]
  reduction: 50   # evaluate every Nth frame; 50 -> 201 frames of the 10001

complexity:
  family: reynolds_ladder_2d
  params: {mach: 0.1, dim: 2}
