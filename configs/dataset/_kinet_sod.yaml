# Shared by kinet's lattice-Boltzmann runs of the Sod shock tube: compressible D2Q9 (two
# populations), entropic BGK, Prandtl number 0.71, on 3001 x 5 nodes of unit spacing, the
# diaphragm at the middle, both states at rest. 1000 solver steps stored every step, with the
# initial condition as frame 0 (1001 frames); the clock is kinet's `time/time`, step / 5. Each
# file is converted from the grouped rollout beside it by `python -m fmeval.data.convert_kinet`
# (docs/datasets/sod_shock_tube.md lists the runs and their states).
#
# A file whose name starts with `_` is a fragment inherited through a `defaults:` list, not a
# dataset you can select.
format: kinet_raw

# pressure is the absolute p = rho T of the compressible physics, so it is not the redundant
# density * c_s^2 the reader drops by default. vorticity is omitted: every field is uniform
# across the 5 transverse nodes to 2e-14 and the transverse velocity is below 1e-15, so the
# vorticity is zero to round-off.
fields: [density, velocity, pressure]

reader:
  include_redundant: true
  # x: kinet's `Neuman` faces at both ends of the tube (dimension 0 in the run config). y: the
  # run config names no face on it, which this older kinet layout streams periodically, and the
  # fields are uniform across y, so periodic and Neumann give the same extension there.
  boundary: [neumann, periodic]

# WHAT IS EVALUATED (docs/recipes/add-a-dataset.md step 3; docs/datasets/logs/sod_shock_tube.md,
# "What part is evaluated"). Steps 450 to 1000, every 50th step: 12 frames.
# - Window. Frames 0 to 449 are the start-up: frame 0 is the bare discontinuity, and before step
#   434 the narrowest region between two waves of the gamma = 1.4 run is under 160 nodes, ten
#   times the default ladder's largest translation (16 cells), the rule of
#   configs/dataset/sod_shock_tube.yaml. At step 450 it is 166 nodes. No wave reaches a wall
#   before step 1914 (gamma = 1.4) or 2372 (gamma = 2), so every stored frame up to 1000 is
#   inside the tube. The gamma = 2 run's rarefaction never meets the rule (89 nodes at step
#   1000); it shares the window so one fragment serves both.
# - Stride. On steps 450 to 1000 every 5th step, the Politis-White block length of the mse
#   trace has a median of 16 to 17 frames, about 85 solver steps, so the window holds about 6
#   to 7 independent samples. Every 50th step puts one or two frames in each block.
# - Analysis grid: native. 3001 and 5 are prime, so no coarser grid divides them.
# - Cost, measured on the login node with the median blur skipped: 5.8 s per frame with mse,
#   2.7 s with shock_set_distance, 5.4 s with persistence_distance, 15.8 s with the 17 metrics
#   that run here; about 3.5 minutes per configuration for the full panel.
# - The default ladder's median blur gives the right answer but costs about 11 minutes per
#   frame here (its square window grows with the square of a width of hundreds of nodes on the
#   5 transverse nodes). No dataset-level ladder exclusion exists, so run these configurations
#   with `degradation.skip=[median_blur]`.
time:
  start: 450
  reduction: 50

complexity:
  family: sod_shock_tube
  params: {dim: 2, resolution: 3001}

notes: "kinet lattice-Boltzmann Sod shock tube, compressible D2Q9 entropic BGK, 3001 x 5, Neumann ends, dimensionless lattice units."
