# The degradation ladder.
#
# Keyed by an instance LABEL, not by operator, so the same operator can appear twice with
# different options (translate_x, translate_y) and each becomes an independent monotone
# axis. `op` defaults to the key. The label -- not the family -- is the unit of rank
# correlation: gaussian_blur and median_blur are separate axes though both are "smoothing".
#
# `python -m degradations` lists every operator with its severity units, and an entry's
# `options` default to its operator's keyword-only parameters, so an entry states an option
# only to change it. `include_reference`, `only` and `skip` are documented on
# `fmeval.ladder.DegradationConfig`.

ladder:
  # --- kernel smoothing ---------------------------------------------------------
  # Severities are a FRACTION OF THE FIELD'S CHARACTERISTIC SCALE, resolved to cells per field
  # against the measured spectrum (`calibration: scale`). A fixed cell count cannot serve both
  # fields: measured here, density varies on ~160 cells against ~34 for vorticity, so sigmas in
  # cells that bite on vorticity do almost nothing on density -- the old list reached 1.2% of
  # the translation anchor's level there, so that axis carried no signal at all.
  #
  # A Gaussian takes a fractional sigma and its severity levels stay distinct at any spacing. The windowed
  # kernels round to an ODD number of cells -- an even window has no centre cell, so it displaces
  # the field by half a cell -- which quantises them coarsely: on a ~34-cell field two fractions
  # closer than about 0.06 land on the same width. The lists below are spaced to clear that on
  # both fields, and any severity level that collapses anyway is flagged and excluded rather than counted.
  gaussian_blur:       {enabled: true,  severities: [0.02, 0.05, 0.10, 0.20]}
  box_blur:            {enabled: true,  severities: [0.06, 0.14, 0.25, 0.40]}
  median_blur:         {enabled: true,  severities: [0.06, 0.14, 0.22]}
  disk_blur:           {enabled: false, severities: [0.06, 0.14, 0.25]}
  epanechnikov_blur:   {enabled: false, severities: [0.06, 0.14, 0.25]}

  # --- spectral -----------------------------------------------------------------
  # Severities are the FRACTION OF FLUCTUATION ENERGY REMOVED, resolved to a cutoff wavenumber
  # per field against the measured spectrum. A low-pass removes what lies above its cutoff and a
  # high-pass what lies below, so the two axes now mean the same thing and both rise with damage.
  #
  # A cutoff in absolute wavenumber cannot serve both fields: [2, 4, 8, 16] removed
  # 0.28/0.48/0.68/0.81 of the vorticity energy but 0.70/0.95/1.00/1.00 of the density energy,
  # saturating at the second severity level so two of four severity levels were the same experiment.
  #
  # A sharp filter must still land on an available set of modes, and no config can undo that.
  # Density's fluctuation energy is 69% in the four diagonal modes at |k| = sqrt(2) and only 3e-5
  # in the axis modes at |k| = 1 just below them, so two consecutive available cutoffs there
  # differ by most of the field and a sharp ladder has only a couple of distinct severity levels however
  # these numbers are written. The Butterworth pair rolls off smoothly and does resolve them,
  # which is a second reason to run both rather than treating the smooth filter as only a ringing
  # control. The report prints the fraction each severity level actually removed beside the fraction it was
  # asked for, so a severity level that landed on the wrong side of those diagonal modes is visible.
  #
  # Both filters are floored at the lowest usable cutoff, |k| = 1. That squeezes the high-pass
  # axis from both sides on a bottom-heavy field: at the floor the filter passes essentially
  # everything -- with the k=0 mean deliberately preserved -- so the severity level is not an experiment at
  # all, while one step above it the damage is already most of the way to the anchor. The
  # window below is the widest measured: it spans a factor 3.4 in damage on vorticity and gives
  # density two clearly separated severity levels of four. That is a property of these fields' spectra, not
  # something a severity list can fix, and it is why the high-pass axis alone does not reach the
  # factor-five damage range the other axes do.
  lowpass_ideal:       {enabled: true,  severities: [0.05, 0.15, 0.30, 0.45]}
  lowpass_butterworth: {enabled: true,  severities: [0.05, 0.15, 0.30, 0.45]}
  highpass_ideal:      {enabled: true,  severities: [0.45, 0.70, 0.90, 0.97]}
  highpass_butterworth: {enabled: true, severities: [0.45, 0.70, 0.90, 0.97]}
  band_attenuate:      {enabled: false, severities: [0.8, 0.5, 0.2, 0.0]}

  # --- geometric: the double-penalty probe ----------------------------------------
  translate_x:         {enabled: true, op: translate, severities: [1, 2, 4, 8, 16]}
  translate_y:         {op: translate, severities: [1, 2, 4, 8, 16],
                        options: {axis: y}, enabled: false}
  translate_subpixel:  {enabled: true, severities: [0.125, 0.25, 0.5, 1.0, 2.0, 4.0]}

  # --- resolution / stochastic / pointwise ------------------------------------------
  coarsen:             {enabled: true, severities: [2, 4, 8, 16]}
  # The same block means as coarsen, reconstructed band-limited instead of as a staircase.
  # Run beside coarsen, not instead of it: a metric that differentiates the field measures
  # coarsen's block edges as well as the lost resolution (issues/039); this isolates the
  # latter.
  coarsen_bandlimited: {enabled: true, severities: [2, 4, 8, 16]}
  subsample:           {severities: [2, 4, 8, 16], enabled: false}
  additive_noise:      {enabled: true, severities: [0.001, 0.01, 0.1, 0.5]}
  multiplicative_noise: {enabled: false, severities: [0.01, 0.1, 0.5]}
  gain:                {severities: [0.01, 0.05, 0.2, 0.5], enabled: false}

  # IN-4. ordinal=False by declaration: excluded from every rank correlation.
  gaussian_impostor:   {enabled: true, severities: [0]}

  # The anchor: the field's spatial mean, the climatological reference forecast. Its median
  # value defines D = 1 for the dimensionless damage score (`analysis.anchor` in config.yaml),
  # so it is a reference measurement rather than a severity level. See judgements/001.
  mean_field:          {enabled: true, severities: [0]}

  # A probe: the reference moved by a large random offset, the right statistics in the wrong
  # place, scored on the damage scale like the impostor above. Six draws, whose median is
  # reported. Not an anchor: on fields whose energy sits in the largest scales the moved copy
  # is anti-correlated with the reference rather than unrelated to it (judgements/001).
  uncorrelated:        {enabled: true, op: random_large_translation, severities: [0, 1, 2, 3, 4, 5]}
