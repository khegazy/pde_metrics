# The miscalibration ladder: an ensemble that is the wrong WIDTH, while its central
# prediction is untouched.
#
# Every other ladder in this directory damages the field. These axes damage the
# prediction's honesty about its own uncertainty, which is a different failure and needs a
# different experiment. Both operators scale the members about their own mean, so the
# ensemble mean is preserved exactly and any metric built on it alone is flat here by
# construction -- which is what makes this a clean test of whether a metric sees
# calibration at all.
#
# Only usable with a dataset whose reader provides an ensemble; see
# configs/dataset/synthetic_ensemble.yaml. At the reference level the ensemble is
# calibrated, so spread_skill is about 1 there.

ladder:
  # --- ensemble dispersion ------------------------------------------------------
  # Two operators rather than one signed severity: the ladder sorts each operator's
  # severities into a single order of increasing damage, and dispersion error is LEAST
  # damaging in the middle. A signed axis would put its mildest case in the interior of
  # the list and invert the rank correlation across half of it.
  #
  # Severities are fractions of the calibrated spread, so they mean the same thing on any
  # field and need no calibration against a measured spectrum.
  spread_inflate: {enabled: true, severities: [0.25, 0.75, 1.5, 3.0]}

  # Stops at 0.8 deliberately. At severity 1 the ensemble is exactly degenerate, and two
  # metrics are then defined rather than measured there: spread_skill returns 0 by its
  # zero-spread rule and rank_histogram sees nothing but ties. That is the edge case, not
  # the axis.
  spread_deflate: {enabled: true, severities: [0.25, 0.5, 0.7, 0.8]}

  # --- where the spread sits, and its shape (dataset_specs/08, Sects. 3.2 and 3.4) ------
  # Cost: these four entries add 16 of the ladder's 30 levels, and variogram_score spends
  # 1.67 s per level and frame at 64^2, so they double the full panel's time on
  # synthetic_ensemble (19 s to 42 s per frame, measured 2026-11-26; see
  # docs/datasets/logs/synthetic_ensemble.md, section 3).
  # Both keep the ensemble mean and the frame's mean variance, so spread_skill and
  # ensemble_mean_rmse are flat on them by construction. flow_dependence raises each cell's
  # spread to the power 1 -/+ severity: damp 1 makes it uniform, damp 2 inverts it. It is
  # most telling on a reader whose true spread varies (`+dataset.reader.sigma_ratio=4`).
  flow_dependence_damp: {enabled: true, op: flow_dependence,
                         severities: [0.25, 0.5, 1.0, 1.5, 2.0]}
  flow_dependence_amplify: {enabled: true, op: flow_dependence, severities: [0.5, 1.0, 2.0],
                            options: {direction: amplify}}
  # member_shape keeps every cell's mean and variance and maps the members onto a Student-t
  # of 1/severity degrees of freedom (nu = 10 to 2.5), or a two-piece normal skewed right.
  heavy_tails: {enabled: true, op: member_shape, severities: [0.1, 0.2, 0.3, 0.4]}
  skew: {enabled: true, op: member_shape, severities: [0.2, 0.4, 0.6, 0.8],
         options: {family: two_piece}}

  # --- accuracy, for contrast ---------------------------------------------------
  # An ordinary per-field operator, applied to each member independently. Included so a run
  # carries one axis that moves the ensemble MEAN beside the two that do not: it is what
  # distinguishes a metric that is blind to dispersion from one that is blind to everything.
  bias: {enabled: true, severities: [0.05, 0.15, 0.3, 0.6]}

  # --- the anchor -----------------------------------------------------------------
  # Damage 1, as on every other ladder (`analysis.anchor` in config.yaml, judgements/001):
  # each member replaced by its own spatial mean, a deterministic forecast of the field's
  # mean with no spread. Without it the analysis falls back to the worst level of some axis,
  # a scale set by how far this config pushed that axis. A metric with a target value reads
  # its damage on its distance from the target, so the anchor sitting on the collapsed side
  # of the spread-to-skill ratio still makes inflation read positive damage.
  mean_field: {enabled: true, severities: [0]}
