# Settings shared by every generated card artifact: the evidence a card may cite, and the
# one snapshot every figure in this repository is drawn from.
#
# Read by `fmeval.config.load_cards_config` into `CardsConfig`, not through Hydra's run-dir
# machinery: generating documentation is not an experiment and should not create a run
# folder or a .hydra directory. A key not in `CardsConfig` is refused, so a new setting
# needs a field there too.

# Which datasets a card's measurements may come from, and what kind of claim a run on each
# supports. The phrase completes "Measured on <dataset>, frames a to b (n frames of ...)" in
# every card's generated run summary (`fmeval.cards.evidence.run_block`), so a card citing a
# dataset says which kind of claim it is making without anyone having to remember to write it.
#
# The dev dataset is absent on purpose and a fingerprint citing it fails the tests. It is
# the first 100 solver steps, before the flow develops, where a 16-cell translation scores
# an mse damage of about 2e-4 on vorticity against 1.4 at t=5000 -- numbers that mean nothing
# physically and would be indistinguishable, once written into a card, from ones that do.
# `taylor_green_2d` stays absent: it is a single Fourier mode, every frame a scalar multiple
# of the first, so its frames are not independent evidence (docs/decisions.md).
#
# `synthetic_ensemble` is admitted for a different reason than kinet_re5e4, and the
# two must not be read the same way. It is not a flow at all and makes no claim to be one:
# it is a calibrated null, built so that the reference is exchangeable with the members and
# every probabilistic metric therefore has a value known in closed form. Evidence from it
# says "this estimator computes what it claims to compute", which is exactly what a first
# implementation needs to demonstrate and is checkable against arithmetic rather than
# opinion. It says nothing about turbulence. The probabilistic metrics are the only ones
# that can use it, because they are the only ones with no physical ensemble to run on
# (issue 004); when one exists their cards should be regenerated against it and this entry
# reconsidered.
#
# `sod_shock_tube` is admitted on the same footing: an analytic check. It is the exact
# solution of Sod's shock tube, with a shock, a contact and a rarefaction at known places,
# and pressure. Evidence from it says the metric locates and scores a known shock correctly,
# and nothing about turbulence. Every metric that can run on it does (AGENTS.md §1, "How
# every metric is evaluated"); a metric declaring `requires_periodic` is never run on it,
# since its ends are walls. Runs on it use the reader's own frames, not `evidence_window`.
#
# `forecast_re5e4` holds real predictions of the kinet_re5e4 flow paired with their targets
# (docs/datasets/reynolds_ladder_2d.md, "Forecast pairs"). Evidence from it says how the metric
# reads real prediction errors along the prediction step, which is how machine-learning
# benchmarks report a metric; it is not a degradation ladder, so it carries no ordering
# statistics. Who produced the predictions is not recorded, and the label says so. Runs on it use
# all of its frames, not `evidence_window`, with `analysis_grid.resolution=64` when they pool its
# three runs.
# `kinet_re1e6` is the same flow at twenty times the Reynolds number, the second member of
# the Reynolds ladder (configs/dataset_family/reynolds_ladder_2d.yaml). Its frames are read on
# kinet_re5e4's clock, so `evidence_window` selects the same physical times on both.
#
# Every dataset built under dataset_specs/BUILD_ORDER.md is an evaluation dataset (Kareem,
# 2026-11-26, that file's "The task" and decision 9): the metrics are evaluated on it and their
# behaviour there measures their sensitivity, so each is admitted below, analytic readers
# included, with a label naming the kind of claim a run on it supports (docs/decisions.md,
# "Every evaluation dataset is evidence, under its label"). The labels are the agent's wording
# (2026-11-27). Every computed dataset's label says "nothing about turbulence", which
# tests/test_configs.py requires. Left out: `taylor_green_2d` (above), and
# `well_radiative_layer_tcool0p32`, which stays unregistered (BUILD_ORDER.md, decision 16).
# `advecting_blobs`, the harness's test bed for time-dependent degradations, predates that plan
# and was admitted on 2026-11-27 as an analytic check (decision 16): it is the reader of the
# registered `feature_population` and `transport_pairs`, its blobs move at different velocities
# so its frames are not scalar multiples of one another, and its candidates are experiments.
# - `kinet_sod_gamma2`'s viscous shock is too spread for the shock detector, so every shock-set
#   metric scores the both-empty 0 on it; its label says so, so the zero is not read as a perfect
#   score.
# - `helmholtz_mixture_2d`'s velocity and pressure frames are not scalar multiples of one
#   another, but its vorticity, the vortex's alone, is; its label says so.
# - `random_field` is the Gaussian null only; its other families are overrides of it and would
#   each need a configuration of their own to carry a different label. Like synthetic_ensemble,
#   it draws from its own `seed` reader option, not the run's: the reader does not need to know
#   the seed used to generate the data (Kareem, 2026-11-27).
# - `kinet_taylor_green_diffusive` and `kinet_taylor_green_fixed_mach` are kinet runs scored
#   against the exact Taylor-Green solution on four grids. Their reference frames are scalar
#   multiples of one another, as taylor_green_2d's are, but the rule that keeps taylor_green_2d
#   out concerns the per-frame statistics of a degradation ladder, which these datasets do not
#   have: their claim is the fall of a solver's error across the grids, whose pattern changes in
#   time (docs/datasets/logs/taylor_green_vortex.md, decision 4 of their section). Their labels
#   say the frames are one pattern scaled in time.
# - `kinet_sod_refinement` is a grid sequence like them: kinet's Sod runs on three grids, each
#   scored against the exact solution on its own cells, read by `observed_order`.
# - `kinet_shear_layer_refinement` scores a coarser kinet run of the shear layer against the
#   512^2 run block-averaged onto its cells. Its label says the reference is the finest grid,
#   not an exact solution, and that the three grids are not in the asymptotic range.
# - `kinet_shear_layer_ensemble` is the first physical ensemble: 16 perturbed kinet runs of the
#   shear layer against a 17th, fixed as the truth, from each of three start states. Its label
#   says it is three cases and that one truth's calibration scatters (velocity error-to-variance
#   ratio 0.46 to 1.93 at the longest lead over the 51 possible truths), so a calibration score on
#   it is read against that scatter; pooling over every choice of truth would make the ratio 17/16
#   identically (dataset_specs/01_physical_ensemble.md, Section 3, correction).
# - `kinet_supersonic_cylinder` is the bow shock of a steady supersonic flow, read in a window
#   upstream of the body so that the shock-set metrics score the shock and not the body's outline;
#   the wake is not in it, and three of the window's faces are cuts declared Neumann.
# - `kinet_hit_re12p5k_candidates`, `kinet_hit_re25k_candidates` and `kinet_hit_re50k_candidates`
#   score kinet reruns of the isotropic realisations, degraded on purpose (a coarser grid, a wrong
#   viscosity, plain BGK collision), against the realisation each started from; the kind of rerun
#   is a reader option, so one configuration holds every kind. At Re = 5e4 the realisation ran on
#   512^2 cells and every rerun on 256^2 or coarser, so even its control carries a grid error; its
#   label says so, and its wrong-viscosity reruns are left out (its config says why).
# - `kinet_isentropic_vortex_mu1em5` and `kinet_isentropic_vortex_mu1em7` are grid sequences of
#   a finite-volume solver's isentropic vortex against the exact solution, read by
#   `observed_order` at the one time each sequence's grids share, the end time; at mu = 1e-7 the
#   run is close to the inviscid exact solution, at the case's mu = 1e-5 its viscous decay limits
#   the order on finer grids, which is why its 512^2 run is not in the sequence.
# - `kinet_oblique_riemann_30deg` and `kinet_oblique_riemann_45deg` are Sod's tube rotated in a
#   square, each run on two grids scored against the exact solution along the normal, read in a
#   window the zero-gradient faces have not disturbed; straight fronts oblique to the grid.
# - `kinet_double_mach_reflection` has no exact solution: several interacting shocks from one
#   solver at a large viscosity, scored through the degradation ladder; its label says it is not
#   the inviscid benchmark picture.
evidence_datasets:
  kinet_re5e4: developed flow
  kinet_re1e6: >-
    developed flow at Re = 1e6, twenty times the Reynolds number of kinet_re5e4, from the same
    initial condition
  synthetic_ensemble: >-
    a calibrated null: evidence that the estimator computes what it claims to compute,
    and nothing about turbulence
  sod_shock_tube: >-
    an analytic check: evidence that the metric locates and scores a known shock
    correctly, and nothing about turbulence
  forecast_re5e4: >-
    real predictions scored against their targets at each prediction step; who produced
    the predictions, a trained model or a coarser solver, is not recorded
  kinet_re5e4_512: >-
    the developed flow of kinet_re5e4 simulated on 512^2 cells, at the same times; not a nested
    refinement of it, since both runs place their nodes at i / (N - 1)
  kinet_hit_re12p5k: >-
    decaying two-dimensional isotropic turbulence at Re = 1.25e4, one realisation per run
  kinet_hit_re25k: >-
    decaying two-dimensional isotropic turbulence at Re = 2.5e4, one realisation per run
  kinet_hit_re50k: >-
    decaying two-dimensional isotropic turbulence at Re = 5e4, simulated on 512^2 cells and
    stored coarse-grained to 256^2, one realisation per run
  kinet_sod_gamma1p4: >-
    a lattice-Boltzmann solver's Sod shock tube at gamma = 1.4, a simulated shock rather than
    the exact one, and nothing about turbulence
  kinet_sod_gamma2: >-
    a lattice-Boltzmann solver's Sod shock tube at gamma = 2, whose viscous shock is too spread
    for the shock detector to flag, so every shock-set metric scores 0 on it; nothing about
    turbulence
  burgers: >-
    an analytic check: the exact Cole-Hopf solution of one-dimensional viscous Burgers'
    equation, a steepening front smoothed by viscosity, and nothing about turbulence
  sedov_taylor: >-
    an analytic check: the exact cylindrical Sedov-Taylor blast wave, a shock oblique to the
    grid at every angle, and nothing about turbulence
  noh: >-
    an analytic check: the exact cylindrical Noh implosion, a circular shock of constant
    strength, and nothing about turbulence
  feature_population: >-
    an analytic check: one static field of isolated bumps, vortices and pressure fronts
    with known answers, and nothing about turbulence
  transport_pairs: >-
    an analytic check: density pairs at an exactly known quadratic Wasserstein distance,
    and nothing about turbulence
  advecting_blobs: >-
    an analytic check: three Gaussian density bumps carried at different constant velocities,
    their exact solution known at every time, and nothing about turbulence
  random_field: >-
    a known-statistics null: independent Gaussian random fields of a prescribed spectrum,
    whose increment statistics are known exactly, and nothing about turbulence
  helmholtz_mixture_2d: >-
    an analytic check: a Taylor-Green vortex plus an exact acoustic mode, its solenoidal and
    dilatational parts known in closed form (its vorticity, the vortex's alone, is one pattern
    scaled in time), and nothing about turbulence
  kinet_taylor_green_diffusive: >-
    a grid sequence: a lattice-Boltzmann solver's Taylor-Green vortex at Re = 50 scored against
    the exact solution on its own 64^2 to 512^2 cells under diffusive scaling, where the error
    falls at order 2; its frames are one pattern scaled in time, and it says nothing about
    turbulence
  kinet_taylor_green_fixed_mach: >-
    a grid sequence: a lattice-Boltzmann solver's Taylor-Green vortex at Re = 50 scored against
    the exact solution on its own 64^2 to 512^2 cells at a fixed Mach number of 0.1, where the
    Mach-number error holds the error at a floor (order about 0); its frames are one pattern
    scaled in time, and it says nothing about turbulence
  kinet_sod_refinement: >-
    a grid sequence: a lattice-Boltzmann solver's Sod shock tube at gamma = 1.4 scored against
    the exact solution on its own 751, 1501 and 3001 nodes, where the density error falls at
    order about 0.67 in L1 and 0.3 to 0.4 in L2; nothing about turbulence
  kinet_shear_layer_refinement: >-
    a lattice-Boltzmann solver's Re = 5e4 shear layer on 128^2 or 256^2 cells scored against
    the same run on 512^2 cells, block-averaged onto the coarser cells: a solver's departure from
    a finer grid of itself, not from an exact solution, on grids not in the asymptotic range
  kinet_shear_layer_ensemble: >-
    a physical ensemble of three cases: 16 perturbed lattice-Boltzmann runs of the Re = 5e4 shear
    layer scored against a 17th, fixed as the truth, from each of three start states, along lead
    times over which the spread grows 2- to 16-fold; one truth's calibration scatters (over the
    51 possible truths the velocity error-to-variance ratio spans 0.46 to 1.93 at the longest
    lead), so a calibration score here is one case of that scatter, not a test of calibration
  kinet_supersonic_cylinder: >-
    the bow shock of a steady Mach 1.8 lattice-Boltzmann flow past a cylinder, read in a window
    upstream of the body that holds the shock and none of the body or the wake, its downstream
    and side faces cuts declared Neumann; nothing about turbulence
  kinet_hit_re12p5k_candidates: >-
    decaying two-dimensional isotropic turbulence at Re = 1.25e4: one lattice-Boltzmann rerun
    degraded on purpose (a coarser grid, a wrong viscosity or plain BGK collision, named by the
    run's candidate file) scored against the realisation it started from, whose undegraded rerun
    matches it to round-off
  kinet_hit_re25k_candidates: >-
    decaying two-dimensional isotropic turbulence at Re = 2.5e4: one lattice-Boltzmann rerun
    degraded on purpose (a coarser grid, a wrong viscosity or plain BGK collision, named by the
    run's candidate file) scored against the realisation it started from, whose undegraded rerun
    matches it to round-off
  kinet_hit_re50k_candidates: >-
    decaying two-dimensional isotropic turbulence at Re = 5e4: one lattice-Boltzmann rerun on
    256^2 cells or coarser, or with plain BGK collision, scored against the 512^2 realisation it
    started from; there is no control, since even the rerun with the realisation's own settings
    departs from it by its coarser grid (velocity distance 0.011 at the first evaluated frame)
  kinet_isentropic_vortex_mu1em5: >-
    a grid sequence: a finite-volume solver's isentropic vortex (viscosity 1e-5) scored against
    the inviscid exact solution on its own 64^2, 128^2 and 256^2 cells after one period, where the
    error falls at order about 2 (1.7 to 2.4 over metrics, fields and pairs); one time per run, and
    nothing about turbulence
  kinet_isentropic_vortex_mu1em7: >-
    a grid sequence: a finite-volume solver's isentropic vortex at viscosity 1e-7, nearly the
    inviscid exact solution it is scored against, on its own 256^2 and 512^2 cells after a quarter
    period, where the error falls at order 1.94 to 2.00; one time and one pair of grids, and
    nothing about turbulence
  kinet_oblique_riemann_30deg: >-
    a finite-volume solver's Sod tube rotated to 30 degrees in a square, on 200^2 and 400^2 cells,
    scored against the exact solution along the normal in a window clear of the faces: straight
    shock, contact and rarefaction oblique to the grid, one time per run; nothing about turbulence
  kinet_oblique_riemann_45deg: >-
    a finite-volume solver's Sod tube rotated to 45 degrees in a square, on 200^2 and 400^2 cells,
    scored against the exact solution along the normal in a window clear of the faces: straight
    shock, contact and rarefaction along the grid's diagonal, one time per run; nothing about
    turbulence
  kinet_double_mach_reflection: >-
    a finite-volume solver's double Mach reflection at a viscosity (0.01) large enough that it is
    a viscous flow, not the inviscid benchmark picture: an incident, a reflected and a Mach-stem
    shock meeting at a triple point, with no exact answer, on 480 x 120 cells read in the window
    x < 3.2 with every face declared Neumann; nothing about turbulence

# What each evidence dataset offers a metric, so every metric card's "Across the experiments"
# table and the site's coverage page can say why a metric is not run on a dataset without
# opening the data (`fmeval.cards.catalog.experiments`). `periodic`: every axis wraps, so a
# metric declaring `requires_periodic` can run. `ensemble`: every frame carries members, so an
# ensemble metric can run, and a pairwise or single-field metric scores the member mean
# (`fmeval.ladder`). Both are properties of the dataset's reader; tests/test_cards.py checks
# them against it. The fields a dataset provides are read from configs/dataset/<name>.yaml.
# Every dataset of `evidence_datasets` needs an entry.
evidence_dataset_properties:
  kinet_re5e4: {periodic: true, ensemble: false}
  kinet_re1e6: {periodic: true, ensemble: false}
  synthetic_ensemble: {periodic: true, ensemble: true}
  sod_shock_tube: {periodic: false, ensemble: false}      # walls at both ends
  forecast_re5e4: {periodic: true, ensemble: false}
  kinet_re5e4_512: {periodic: true, ensemble: false}
  kinet_hit_re12p5k: {periodic: true, ensemble: false}
  kinet_hit_re25k: {periodic: true, ensemble: false}
  kinet_hit_re50k: {periodic: true, ensemble: false}
  kinet_sod_gamma1p4: {periodic: false, ensemble: false}  # Neumann ends of the tube
  kinet_sod_gamma2: {periodic: false, ensemble: false}    # Neumann ends of the tube
  burgers: {periodic: true, ensemble: false}
  sedov_taylor: {periodic: false, ensemble: false}        # Neumann on both axes
  noh: {periodic: false, ensemble: false}                 # Neumann on both axes
  feature_population: {periodic: true, ensemble: false}
  transport_pairs: {periodic: true, ensemble: false}
  advecting_blobs: {periodic: true, ensemble: false}
  random_field: {periodic: true, ensemble: false}
  helmholtz_mixture_2d: {periodic: true, ensemble: false}
  kinet_taylor_green_diffusive: {periodic: true, ensemble: false}
  kinet_taylor_green_fixed_mach: {periodic: true, ensemble: false}
  kinet_sod_refinement: {periodic: false, ensemble: false}    # Neumann ends of the tube
  kinet_shear_layer_refinement: {periodic: true, ensemble: false}
  kinet_shear_layer_ensemble: {periodic: true, ensemble: true}
  kinet_supersonic_cylinder: {periodic: false, ensemble: false}  # Neumann; three faces are cuts
  kinet_hit_re12p5k_candidates: {periodic: true, ensemble: false}
  kinet_hit_re25k_candidates: {periodic: true, ensemble: false}
  kinet_hit_re50k_candidates: {periodic: true, ensemble: false}
  kinet_isentropic_vortex_mu1em5: {periodic: true, ensemble: false}
  kinet_isentropic_vortex_mu1em7: {periodic: true, ensemble: false}
  kinet_oblique_riemann_30deg: {periodic: false, ensemble: false}  # Neumann; every face a cut
  kinet_oblique_riemann_45deg: {periodic: false, ensemble: false}  # Neumann; every face a cut
  kinet_double_mach_reflection: {periodic: false, ensemble: false}  # Neumann; no face is one

# The window within kinet_re5e4 that counts as developed flow: the convention a run cited
# as evidence follows (`dataset.time.start`, `dataset.time.reduction`). Nothing reads it to
# select frames; a test checks the exemplar frame below lies inside it, and each fingerprint
# records the frames its run actually used.
#
# It is one window, kinet_re5e4's, and it also holds for kinet_re1e6 (same clock); kinet_re5e4_512
# reads the same window at every 400th frame (`frame_stride: 2` puts its frames at the times of
# kinet_re5e4's; its config states the start and stride). Every other evidence dataset's
# evaluated part is the `time:` selection, reader options, `analysis_resolution` and
# `exclude_degradations` of its own configs/dataset/<name>.yaml, chosen and measured in its log
# (docs/datasets/logs/), and a run cited from it uses those, as Sod's runs use the reader's own
# frames: the 128 grid of kinet_hit_*, the 256 grid of kinet_re5e4_512, and the median blur
# kinet_sod_* exclude. What a config still does not state is given on the command line:
# - kinet_hit_*: five realisations each, swept with `-m dataset.trajectory=<k1>,...,<k5>` (the
#   keys are in each config's comments) and gathered with `fmeval.io.combine_runs(...,
#   across="trajectory")`;
# - helmholtz_mixture_2d: the two disabled `scale_dilatational` ladder entries switched on;
# - feature_population: its single-feature candidates, one override each (its config lists them).
# - kinet_taylor_green_*: the four grids, swept with `-m dataset.trajectory=N64,N128,N256,N512`,
#   each at its native resolution, and read together by `fmeval.analysis.observed_order`.
# - kinet_sod_refinement: the three grids, `-m dataset.trajectory=N751,N1501,N3001`, read
#   together by `fmeval.analysis.observed_order`.
# - kinet_shear_layer_refinement: both candidates, `-m dataset.trajectory=256,128`, each on its
#   own grid (the configuration sets the analysis grid from the trajectory).
# - kinet_shear_layer_ensemble: the three starts, `-m dataset.trajectory=start_02000,start_05000,
#   start_08000`, gathered with `fmeval.io.combine_runs(..., across="trajectory")`; the ensemble
#   metrics on `degradation=ensemble_miscalibration`, the others on the default ladder.
# - kinet_hit_re*_candidates: every kind of rerun for each of the five realisations, `-m
#   dataset.trajectory=<k1>,...,<k5> dataset.reader.candidate=<kind>.h5,...`, with
#   `dataset.analysis_resolution=64` for grid64.h5 (each config's comments list the keys and
#   kinds), and the five realisations of one kind gathered with `fmeval.io.combine_runs(...,
#   across="trajectory")`. A card cites one run per dataset, so which kind it cites is open.
# - kinet_isentropic_vortex_mu1em5 and _mu1em7: the grids, `-m dataset.trajectory=N64,N128,N256`
#   and `N256,N512`, each at its native resolution, read together by `observed_order`.
# - kinet_oblique_riemann_30deg and _45deg: the two grids, `-m dataset.trajectory=N200,N400`,
#   read together by `observed_order`.
evidence_window:
  start: 2000       # the flow is developed well before this
  reduction: 50     # every 50th frame; ~160 frames, a run of about a minute

# The single frame every exemplar panel in the repository is drawn from.
#
# One frame for the whole repository, not one per degradation. Two degradations
# illustrated on different snapshots cannot be compared, which would defeat the gallery
# that puts all of them on one page. Fixed here so that choice is made once, visibly,
# rather than implicitly by whoever generates a panel first.
exemplar_frame:
  dataset: kinet_re5e4
  index: 5000       # mid-window: developed, and far from either end of the trajectory
  fields: [vorticity, density]

# Figure rendering. Fixed so that regenerating an unchanged panel produces an unchanged
# file rather than a diff nobody can review.
figures:
  dpi: 100          # exemplar panels (PNG): ~280 KB per panel; the cap is roughly 300 KB
  # The theme is fmeval/report/style.py's DEFAULT_THEME, so the site and the report agree.
  # The metric-card figures (fmeval/cards/metric_figures.py) are SVG, sharp at any zoom and
  # byte-stable with a fixed hashsalt and no creation date; measured on the pinned run, the
  # response-curve figure is 110-240 KB and the sensitivity profile 60-120 KB per metric.
