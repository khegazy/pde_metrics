schema_version: 1

name: random_large_translation
kind: degradation
category: geometric

summary: >-
  Shifts the field by a large random displacement: on a periodic domain, the right statistics
  in the wrong place. A probe, not the damage anchor.

status: candidate
owners: [khegazy]

failure_mode: >-
  The double penalty at its limit: a field with the right statistics and no correspondence
  to the truth's positions.

output:
  description: >-
    A draw index, not a severity. Each level is an independent random offset drawn from
    the same distribution; the levels are not ordered and carry no increasing damage.
  bounds:
    lower: 0.0
    upper: null

exemplars:
  mode: draws
  n_draws: 3
  field_name: vorticity
  diagnostics: [difference, pdf]
  rationale: >-
    Three independent draws beside the original, because there is no weak-to-strong
    ordering to show. The pdf row is the point: every draw has exactly the reference's
    distribution of values, which is what makes it the right kind of field in the wrong
    place rather than merely a bad field.

references: []
review: null
